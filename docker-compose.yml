# Docker Compose for Markov Chain Text Generator

version: '3.8'

services:
  markov-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MARKOV_ENVIRONMENT=production
      - MARKOV_HOST=0.0.0.0
      - MARKOV_PORT=8000
      - MARKOV_LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/corpora"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - markov-app
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
