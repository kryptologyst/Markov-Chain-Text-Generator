<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markov Chain Text Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .generated-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.1em;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .corpus-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .corpus-card:hover {
            transform: translateY(-5px);
        }
        .loading {
            display: none;
        }
        .stats-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .parameter-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .history-item {
            background: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 10px;
            margin: 5px 0;
            border-radius: 0 5px 5px 0;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-brain"></i> Markov Chain Text Generator
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Left Column: Controls -->
            <div class="col-md-4">
                <div class="card parameter-card mb-4">
                    <div class="card-header">
                        <h5><i class="fas fa-cog"></i> Generation Parameters</h5>
                    </div>
                    <div class="card-body">
                        <form id="generationForm">
                            <div class="mb-3">
                                <label for="corpusSelect" class="form-label">Corpus</label>
                                <select class="form-select" id="corpusSelect" required>
                                    <option value="">Loading corpora...</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="startPhrase" class="form-label">Start Phrase (optional)</label>
                                <input type="text" class="form-control" id="startPhrase" 
                                       placeholder="Enter starting words...">
                            </div>
                            
                            <div class="mb-3">
                                <label for="maxLength" class="form-label">Max Length</label>
                                <input type="number" class="form-control" id="maxLength" 
                                       value="50" min="5" max="200">
                            </div>
                            
                            <div class="mb-3">
                                <label for="order" class="form-label">Markov Order</label>
                                <select class="form-select" id="order">
                                    <option value="1">1 (Basic)</option>
                                    <option value="2" selected>2 (Recommended)</option>
                                    <option value="3">3 (Advanced)</option>
                                    <option value="4">4 (Expert)</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="smoothing" class="form-label">Smoothing</label>
                                <select class="form-select" id="smoothing">
                                    <option value="laplace" selected>Laplace</option>
                                    <option value="good_turing">Good-Turing</option>
                                    <option value="none">None</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-light w-100">
                                <i class="fas fa-magic"></i> Generate Text
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Model Stats -->
                <div class="card stats-card mb-4">
                    <div class="card-header">
                        <h5><i class="fas fa-chart-bar"></i> Model Statistics</h5>
                    </div>
                    <div class="card-body" id="modelStats">
                        <p class="text-center">Select a corpus to view statistics</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Results -->
            <div class="col-md-8">
                <!-- Generated Text -->
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="fas fa-file-alt"></i> Generated Text</h5>
                        <div class="loading" id="loadingSpinner">
                            <div class="spinner-border spinner-border-sm" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="generatedText" class="generated-text">
                            <p class="text-center mb-0">
                                <i class="fas fa-arrow-up"></i> Configure parameters and click "Generate Text" to start
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Generation History -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="fas fa-history"></i> Generation History</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="clearHistory()">
                            <i class="fas fa-trash"></i> Clear
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="generationHistory">
                            <p class="text-muted text-center">No generations yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Corpus Information -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-database"></i> Available Corpora</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="corpusCards">
                            <!-- Corpus cards will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let generationHistory = [];

        // Load corpora on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadCorpora();
            loadCorpusCards();
        });

        // Load available corpora
        async function loadCorpora() {
            try {
                const response = await fetch('/api/corpora');
                const corpora = await response.json();
                
                const select = document.getElementById('corpusSelect');
                select.innerHTML = '<option value="">Select a corpus...</option>';
                
                corpora.forEach(corpus => {
                    const option = document.createElement('option');
                    option.value = corpus.name;
                    option.textContent = `${corpus.name} (${corpus.text_count} texts, ${corpus.total_words} words)`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading corpora:', error);
            }
        }

        // Load corpus cards
        async function loadCorpusCards() {
            try {
                const response = await fetch('/api/corpora');
                const corpora = await response.json();
                
                const container = document.getElementById('corpusCards');
                container.innerHTML = '';
                
                corpora.forEach(corpus => {
                    const card = document.createElement('div');
                    card.className = 'col-md-4 mb-3';
                    card.innerHTML = `
                        <div class="card corpus-card h-100" onclick="selectCorpus('${corpus.name}')">
                            <div class="card-body">
                                <h6 class="card-title">${corpus.name}</h6>
                                <p class="card-text">
                                    <small class="text-muted">
                                        ${corpus.text_count} texts<br>
                                        ${corpus.total_words} total words
                                    </small>
                                </p>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading corpus cards:', error);
            }
        }

        // Select corpus
        function selectCorpus(corpusName) {
            document.getElementById('corpusSelect').value = corpusName;
            loadModelStats(corpusName);
        }

        // Load model statistics
        async function loadModelStats(corpusName) {
            try {
                const response = await fetch(`/api/model/${corpusName}/stats`);
                const stats = await response.json();
                
                const statsContainer = document.getElementById('modelStats');
                statsContainer.innerHTML = `
                    <div class="row text-center">
                        <div class="col-6">
                            <h6>${stats.vocabulary_size}</h6>
                            <small>Vocabulary Size</small>
                        </div>
                        <div class="col-6">
                            <h6>${stats.total_states}</h6>
                            <small>Total States</small>
                        </div>
                        <div class="col-6 mt-2">
                            <h6>${stats.total_transitions}</h6>
                            <small>Transitions</small>
                        </div>
                        <div class="col-6 mt-2">
                            <h6>${stats.order}</h6>
                            <small>Order</small>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading model stats:', error);
            }
        }

        // Handle form submission
        document.getElementById('generationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                corpus_name: document.getElementById('corpusSelect').value,
                start_phrase: document.getElementById('startPhrase').value || null,
                max_length: parseInt(document.getElementById('maxLength').value),
                order: parseInt(document.getElementById('order').value),
                smoothing: document.getElementById('smoothing').value
            };

            if (!formData.corpus_name) {
                alert('Please select a corpus');
                return;
            }

            // Show loading
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('generatedText').innerHTML = '<p class="text-center">Generating...</p>';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                // Display generated text
                document.getElementById('generatedText').innerHTML = `
                    <p>${result.generated_text}</p>
                    <hr>
                    <small class="opacity-75">
                        Generated from: <strong>${result.corpus_name}</strong> | 
                        Order: ${result.parameters.order} | 
                        Smoothing: ${result.parameters.smoothing}
                    </small>
                `;

                // Add to history
                addToHistory(result);

            } catch (error) {
                console.error('Error generating text:', error);
                document.getElementById('generatedText').innerHTML = `
                    <p class="text-danger">Error generating text: ${error.message}</p>
                `;
            } finally {
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        });

        // Add to generation history
        function addToHistory(result) {
            generationHistory.unshift({
                text: result.generated_text,
                corpus: result.corpus_name,
                timestamp: new Date().toLocaleTimeString(),
                parameters: result.parameters
            });

            // Keep only last 10 generations
            if (generationHistory.length > 10) {
                generationHistory = generationHistory.slice(0, 10);
            }

            updateHistoryDisplay();
        }

        // Update history display
        function updateHistoryDisplay() {
            const container = document.getElementById('generationHistory');
            
            if (generationHistory.length === 0) {
                container.innerHTML = '<p class="text-muted text-center">No generations yet</p>';
                return;
            }

            container.innerHTML = generationHistory.map((item, index) => `
                <div class="history-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <p class="mb-1">${item.text}</p>
                            <small class="text-muted">
                                ${item.corpus} | ${item.timestamp} | 
                                Order: ${item.parameters.order} | 
                                Length: ${item.parameters.max_length}
                            </small>
                        </div>
                        <button class="btn btn-sm btn-outline-primary ms-2" onclick="copyToClipboard('${item.text.replace(/'/g, "\\'")}')">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Copy text to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Show brief success message
                const button = event.target.closest('button');
                const originalHTML = button.innerHTML;
                button.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => {
                    button.innerHTML = originalHTML;
                }, 1000);
            });
        }

        // Clear history
        function clearHistory() {
            generationHistory = [];
            updateHistoryDisplay();
        }
    </script>
</body>
</html>
